<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Wordtable — offline-first hot-seat and online word game on a wooden table." />
    <meta name="theme-color" content="#2e1a12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Wordtable</title>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="app"><main class="table"><h1 class="table-title">Wordtable</h1><div class="board-host"></div><div id="prov-score" role="status" aria-live="polite">0 pts</div><div id="rack" class="rack" role="listbox" aria-label="Rack"></div><div id="rack-actions"><button type="button" data-action="recall">Recall</button><button type="button" data-action="shuffle">Shuffle</button></div><div class="table-actions"><button type="button" data-action="create">Create</button><button type="button" data-action="join">Join</button><button type="button" data-action="play">Play</button></div><div id="float-layer" aria-hidden="true"></div><div id="toast" role="status" hidden></div><div id="blank-picker" hidden><div class="picker-sheet" role="dialog" aria-modal="true" aria-label="Choose a letter"><p class="picker-title">Choose a letter</p><div class="picker-grid"><button type="button" data-letter="A">A</button><button type="button" data-letter="B">B</button><button type="button" data-letter="C">C</button><button type="button" data-letter="D">D</button><button type="button" data-letter="E">E</button><button type="button" data-letter="F">F</button><button type="button" data-letter="G">G</button><button type="button" data-letter="H">H</button><button type="button" data-letter="I">I</button><button type="button" data-letter="J">J</button><button type="button" data-letter="K">K</button><button type="button" data-letter="L">L</button><button type="button" data-letter="M">M</button><button type="button" data-letter="N">N</button><button type="button" data-letter="O">O</button><button type="button" data-letter="P">P</button><button type="button" data-letter="Q">Q</button><button type="button" data-letter="R">R</button><button type="button" data-letter="S">S</button><button type="button" data-letter="T">T</button><button type="button" data-letter="U">U</button><button type="button" data-letter="V">V</button><button type="button" data-letter="W">W</button><button type="button" data-letter="X">X</button><button type="button" data-letter="Y">Y</button><button type="button" data-letter="Z">Z</button></div><button type="button" data-action="cancel-picker">Cancel</button></div></div></main></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
